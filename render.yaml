services:
  - type: web
    name: moviemood-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moviemood-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: moviemood-frontend
          property: url

  - type: web
    name: moviemood-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: moviemood-backend
          property: url

databases:
  - name: moviemood-db
    databaseName: moviemood
    user: moviemood_user
    plan: free
